<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Реалістичний 3D Глобус Землі</title>
  <style>
    :root {
      --bg1: #020b15;
      --bg2: #081d2d;
      --panel-bg: rgba(9, 18, 30, 0.72);
      --panel-border: rgba(120, 210, 255, 0.38);
      --text: #dff8ff;
      --accent: #5dd9ff;
      --muted: #9bbfcf;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, var(--bg2) 0%, var(--bg1) 50%, #000 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    .panel {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45), inset 0 0 22px rgba(93, 217, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 15px 26px;
      text-align: center;
      user-select: none;
      pointer-events: none;
      z-index: 2;
    }

    .panel h1 {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(93, 217, 255, 0.45);
    }

    .panel p {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }

    .floating-label {
      position: absolute;
      top: 18px;
      left: 18px;
      background: rgba(5, 15, 25, 0.62);
      border: 1px solid rgba(93, 217, 255, 0.25);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.8px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      user-select: none;
      pointer-events: none;
      z-index: 2;
      box-shadow: 0 10px 25px rgba(0,0,0,0.28);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="floating-label">🌍 Земля • Крутіть • Масштабування • Навколишній космос</div>

  <div class="panel">
    <h1>3D EXPLORER</h1>
    <p>Поверніть Землю мишкою або пальцем, щоб оглянути космос</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    const container = document.getElementById('canvas-container');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020b15);
    scene.fog = new THREE.FogExp2(0x020b15, 0.022);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 0.2, 3.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Освітлення
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.6);
    sunLight.position.set(4, 2, 5);
    scene.add(sunLight);

    const rimLight = new THREE.DirectionalLight(0x5ab7ff, 0.7);
    rimLight.position.set(-4, -2, -4);
    scene.add(rimLight);

    // Глобус Землі
    const earthGroup = new THREE.Group();
    scene.add(earthGroup);

    const earthTexture = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg');
    const earthBump = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg');
    const earthSpec = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg');
    const earthClouds = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');

    const earthMaterial = new THREE.MeshPhongMaterial({
      map: earthTexture,
      bumpMap: earthBump,
      bumpScale: 0.022,
      specularMap: earthSpec,
      specular: new THREE.Color(0x333333),
      shininess: 10,
      emissive: 0x0d1f2d,
      emissiveIntensity: 0.15
    });

    const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 128, 128), earthMaterial);
    earthGroup.add(earth);

    const cloudMaterial = new THREE.MeshPhongMaterial({
      map: earthClouds,
      transparent: true,
      opacity: 0.38,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const clouds = new THREE.Mesh(new THREE.SphereGeometry(1.02, 128, 128), cloudMaterial);
    earthGroup.add(clouds);

    // Атмосфера Землі
    const atmosphereMaterial = new THREE.ShaderMaterial({
      uniforms: {
        glowColor: { value: new THREE.Color(0x43b7ff) },
        viewVector: { value: camera.position }
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          vNormal = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 glowColor;
        varying vec3 vNormal;
        varying vec3 vWorldPosition;
        void main() {
          float intensity = pow(0.8 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.5);
          vec3 color = glowColor * intensity;
          gl_FragColor = vec4(color, 0.7);
        }
      `,
      side: THREE.BackSide,
      blending: THREE.AdditiveBlending,
      transparent: true,
      depthWrite: false
    });

    const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(1.12, 128, 128), atmosphereMaterial);
    earthGroup.add(atmosphere);

    // Зірки
    const starGeometry = new THREE.BufferGeometry();
    const starCount = 2500;
    const starPositions = [];

    for (let i = 0; i < starCount; i++) {
      const radius = 18 + Math.random() * 20;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);

      const x = radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.cos(phi);
      const z = radius * Math.sin(phi) * Math.sin(theta);

      starPositions.push(x, y, z);
    }

    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));

    const starMaterial = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.06,
      transparent: true,
      opacity: 0.9
    });

    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // Месяць
    const moonTexture = new THREE.TextureLoader().load('https://threejs.org/examples/textures/planets/moon_1024.jpg');
    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(0.17, 64, 64),
      new THREE.MeshStandardMaterial({ map: moonTexture, roughness: 1, metalness: 0 })
    );
    moon.position.set(2.2, 0.6, 0);
    scene.add(moon);

    // Небо і орбіти
    const orbitMaterial = new THREE.LineBasicMaterial({ color: 0x3a6d9d, transparent: true, opacity: 0.2 });
    const orbitGeometry = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-3, 0, 0),
      new THREE.Vector3(3, 0, 0)
    ]);
    const orbit = new THREE.Line(orbitGeometry, orbitMaterial);
    orbit.rotation.x = Math.PI / 2;
    scene.add(orbit);

    const orbit2 = new THREE.Line(orbitGeometry.clone(), orbitMaterial.clone());
    orbit2.rotation.z = Math.PI / 2.5;
    scene.add(orbit2);

    // Управління камерою
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enableZoom = true;
    controls.minDistance = 1.8;
    controls.maxDistance = 8;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;

    // Для плавного крутіння з широким зоряним фоном
    let t = 0;

    function animate() {
      requestAnimationFrame(animate);

      t += 0.01;

      earth.rotation.y += 0.0018;
      clouds.rotation.y += 0.0015;
      stars.rotation.y -= 0.00015;
      stars.rotation.x = Math.sin(t * 0.2) * 0.12;

      moon.position.x = 2.2 + Math.sin(t * 0.8) * 0.25;
      moon.position.y = 0.6 + Math.cos(t * 0.8) * 0.18;
      moon.position.z = 0.2 + Math.sin(t * 0.6) * 0.15;

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
